{% extends "base.html" %} {% block title %}igloo — Home{% endblock %} {% block
content %}
<div x-data="{ message: 'Welcome to igloo', count: 0 }">
  <h1 class="text-3xl font-bold text-gray-800 mb-4" x-text="message"></h1>
  <div class="bg-white rounded-lg shadow p-6 mb-6">
    <h2 class="text-lg font-semibold mb-2">Alpine.js Counter</h2>
    <p class="text-2xl font-mono mb-3" x-text="count"></p>
    <button
      @click="count++"
      class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition"
    >
      Increment
    </button>
  </div>
  <div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-lg font-semibold mb-2">HTMX Dynamic Content</h2>
    <div
      hx-get="/welcome"
      hx-trigger="load"
      hx-swap="innerHTML"
      class="text-gray-500"
    >
      Loading...
    </div>
  </div>
</div>
{% endblock %}
